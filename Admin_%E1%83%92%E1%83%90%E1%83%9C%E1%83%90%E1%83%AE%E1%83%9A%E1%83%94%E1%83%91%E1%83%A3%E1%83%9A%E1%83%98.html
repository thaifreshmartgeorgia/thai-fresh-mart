<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://accounts.google.com/gsi/client" async defer></script><style>
:root{font-family:Arial,sans-serif;color:#183a32;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0}.muted{color:#64766d;font-size:13px}.panel{background:white;border:1px solid #dce6df;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 4px 18px #173b3010}button{border:0;border-radius:8px;padding:10px 14px;background:#176b50;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e7eee9;color:#183a32}button.danger{background:#a33b32}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#123d32}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-size:12px;color:#64766d;margin:8px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd8d0;border-radius:8px;font-size:15px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e6ece8}th{color:#5c7066}.scroll{overflow:auto}.hidden{display:none!important}.status{padding:10px;background:#eef5ef;border-radius:8px;margin:12px 0}.product{display:flex;gap:12px;align-items:center}.product img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#eee}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:600px){.wrap{padding:12px}.panel{padding:13px}table{min-width:650px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>THAI FRESH MART — Admin</h1><div class="muted">Product catalogue and order management</div></div><div id="user" class="muted">Not signed in</div></div>
<section id="login" class="panel"><h3>Sign in with Google</h3><p class="muted">Only the two authorized Gmail accounts can access this panel.</p><div id="gbtn"></div><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div class="panel"><div class="tabs"><button id="tabProducts" class="active" onclick="showTab('products')">Products</button><button id="tabOrders" class="secondary" onclick="showTab('orders')">Orders</button><button class="secondary" onclick="signOut()">Sign out</button></div></div>
<div id="products"><div id="editor" class="panel hidden"><h3 id="editorTitle">Product</h3><input id="pid" type="hidden"><div class="grid"><div><label>English name</label><input id="en"></div><div><label>Georgian name</label><input id="ka"></div><div><label>Price (GEL/kg)</label><input id="price" type="number" min="0" step="0.01"></div><div><label>Category</label><select id="category"><option value="vegetable">Vegetable</option><option value="fruit">Fruit</option></select></div><div><label>Status</label><select id="status"><option>PRE-ORDER</option><option>AVAILABLE</option><option>OUT OF STOCK</option></select></div><div><label>Display order</label><input id="sortOrder" type="number"></div><div><label>Product photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div></div><label><input id="active" type="checkbox" checked style="width:auto"> Active on website</label><p class="muted" id="imageState"></p><div class="actions"><button onclick="saveProduct()">Save product</button><button class="secondary" onclick="closeEditor()">Cancel</button></div></div><div class="panel"><div class="top"><h3>Products</h3><button onclick="newProduct()">+ Add product</button></div><div class="scroll"><table><thead><tr><th>Product</th><th>Price/kg</th><th>Category</th><th>Status</th><th>Active</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div></div>
</div>
<div id="orders" class="hidden"><div class="panel"><h3>Recent orders</h3><div class="scroll"><table><thead><tr><th>Date</th><th>Invoice</th><th>Company</th><th>Contact</th><th>Total</th><th>PDF</th><th>Status</th></tr></thead><tbody id="orderRows"></tbody></table></div></div></div></section></main>
<script>
let token='',role='',products=[],imageUrl='';const CLIENT_ID='509706176623-7rnv6ndp8bjcgql4pfekj5qrc2ebqm9d.apps.googleusercontent.com';
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbw9s18X6C5S-ORBg9sa1vA7mntVWVHljyYwKwa1HpEwOBK4NwdowB2Nhhh8svAgTFyl5g/exec';
let requestCounter=0;
function say(s){document.getElementById('msg').textContent=s}
function init(){if(CLIENT_ID.startsWith('PASTE_')){say('Setup required: add the Google OAuth Client ID and your website origin first.');return;}google.accounts.id.initialize({client_id:CLIENT_ID,callback:credential=>{token=credential.credential;call('adminInfo',{}).then(x=>{role=x.role;document.getElementById('user').textContent=x.email+' · '+role;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadProducts();}).catch(e=>{token='';say(e.message);});}});google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large',text:'signin_with'});}
function call(action,payload){
 return new Promise((resolve,reject)=>{
  const nonce='n'+Date.now().toString(36)+Math.random().toString(36).slice(2);
  const frameName='tfmAdminFrame'+(++requestCounter);
  const frame=document.createElement('iframe');frame.name=frameName;frame.style.display='none';document.body.appendChild(frame);
  const form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target=frameName;form.style.display='none';
  const fields={adminAction:action,idToken:token,payload:JSON.stringify(payload||{}),nonce,origin:window.location.origin};
  Object.entries(fields).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=v;form.appendChild(input);});
  const timer=setTimeout(()=>{cleanup();reject(new Error('No response from admin server. Please refresh and check whether the change was saved.'));},20000);
  function cleanup(){clearTimeout(timer);window.removeEventListener('message',listener);form.remove();frame.remove();}
  function listener(event){const d=event.data;if(!d||d.type!=='TFM_ADMIN_RESULT'||d.nonce!==nonce)return;cleanup();if(d.data&&d.data.ok)resolve(d.data);else reject(new Error(d.data?.error||'Admin action failed.'));}
  window.addEventListener('message',listener);document.body.appendChild(form);form.submit();
 });
}
function showTab(t){document.getElementById('products').classList.toggle('hidden',t!=='products');document.getElementById('orders').classList.toggle('hidden',t!=='orders');document.getElementById('tabProducts').className=t==='products'?'active':'';document.getElementById('tabOrders').className=t==='orders'?'active':'secondary';if(t==='orders')loadOrders();}
function loadProducts(){call('listProducts',{}).then(r=>{products=r.products;document.getElementById('productRows').innerHTML=products.map(p=>`<tr><td><div class="product">${p.image?`<img src="${esc(p.image)}">`:''}<div><b>${esc(p.en)}</b><br><span class="muted">${esc(p.ka)}</span></div></div></td><td>${p.price}</td><td>${p.category}</td><td>${p.status}</td><td>${p.active?'Yes':'No'}</td><td><div class="actions"><button class="secondary" onclick="editProduct('${p.id}')">Edit</button><button class="danger" onclick="removeProduct('${p.id}')">Delete</button></div></td></tr>`).join('');}).catch(e=>say(e.message));}
function newProduct(){fill({id:'',en:'',ka:'',price:'',category:'vegetable',status:'PRE-ORDER',active:true,image:'',sortOrder:products.length+1});}
function editProduct(id){fill(products.find(p=>p.id===id));}
function fill(p){document.getElementById('editor').classList.remove('hidden');['id','en','ka','price','category','status','sortOrder'].forEach(k=>document.getElementById(k==='id'?'pid':k).value=p[k]??'');document.getElementById('active').checked=p.active!==false;imageUrl=p.image||'';document.getElementById('imageState').textContent=imageUrl?'Current image saved. Choose a new file to replace it.':'No image selected.';document.getElementById('photo').value='';}
function closeEditor(){document.getElementById('editor').classList.add('hidden');}
async function saveProduct(){try{const file=document.getElementById('photo').files[0];if(file && file.size>7*1024*1024)throw new Error('Image must be smaller than 7 MB.');if(file){const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});const up=await call('uploadImage',{name:file.name,mimeType:file.type,data});imageUrl=up.url;}const p={id:document.getElementById('pid').value,en:document.getElementById('en').value,ka:document.getElementById('ka').value,price:document.getElementById('price').value,category:document.getElementById('category').value,status:document.getElementById('status').value,active:document.getElementById('active').checked,image:imageUrl,sortOrder:document.getElementById('sortOrder').value};await call('saveProduct',p);say('Product saved.');closeEditor();loadProducts();}catch(e){alert(e.message);}}
function removeProduct(id){if(confirm('Delete this product?'))call('deleteProduct',{id}).then(()=>{say('Product deleted.');loadProducts();}).catch(e=>alert(e.message));}
function loadOrders(){call('listOrders',{}).then(r=>{document.getElementById('orderRows').innerHTML=r.orders.map(o=>`<tr><td>${esc(o.date)}</td><td>${esc(o.invoice)}</td><td>${esc(o.company)}</td><td>${esc(o.contact)}<br>${esc(o.phone)}</td><td>${o.total.toFixed(2)} GEL</td><td>${o.pdf?`<a href="${esc(o.pdf)}" target="_blank">PDF</a>`:''}</td><td><select onchange="setOrderStatus('${o.invoice}',this.value)">${['New','Processing','Confirmed','Completed','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');}).catch(e=>say(e.message));}
function setOrderStatus(invoice,status){call('updateOrderStatus',{invoice,status}).then(()=>say('Order status updated.')).catch(e=>alert(e.message));}
function signOut(){token='';location.reload();}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.addEventListener('load',()=>{let n=0;const timer=setInterval(()=>{if(window.google?.accounts?.id){clearInterval(timer);init();}if(++n>30)clearInterval(timer);},300);});
</script></body></html>
